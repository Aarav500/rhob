[build-system]
# setuptools 77 is the first to accept the SPDX string form of `license` below (older
# releases refuse it), and since 70.1 setuptools builds wheels itself, so `wheel` is no
# longer a build requirement.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rhob"
version = "1.8.0"
description = "RHOB, the case study for 'Checks That Cannot Fail': reward-hacking environment families certified by a falsifiable admission gate"
readme = "README.md"
requires-python = ">=3.10"
# An SPDX expression and the file it names (PEP 639). The `{text = "MIT"}` table this
# replaces is deprecated by setuptools 77 and later, which stop supporting it after
# 2027-02-18; the project declares no License classifier, which setuptools would refuse
# beside an expression.
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Aarav Shah", email = "aarav7.shah@gmail.com"}]

# Version policy: floors state the oldest supported release; upper bounds cap the
# next major so a dependency's breaking release cannot silently change benchmark
# numbers. These ranges make RHOB installable; they do NOT reproduce a result.
# To reproduce a number, match the versions in that artifact's provenance block;
# REPRODUCIBILITY.md (Environment Setup) describes the two pinned files and their limits.
dependencies = [
    "numpy>=1.24,<3",
    "scipy>=1.10,<2",
    "scikit-learn>=1.3,<2",
    "h5py>=3.8,<4",
    "pydantic>=2.0,<3",
    "click>=8.0,<9",
]

[project.optional-dependencies]
# Needed only for PPO/SB3-based trajectory generation in future
# continuous-control tiers. The Tier 1 tabular environments do not require them.
environments = ["gymnasium>=0.29,<2", "stable-baselines3>=2.0,<3"]
# Continuous-control tier (Pairs 02-04): the DQN camping agent needs PyTorch.
# The Tier 1 gridworld pairs and all core evaluation do NOT require it.
continuous = ["torch>=2.0,<3", "matplotlib>=3.5,<4"]
# MuJoCo-based high-dimensional continuous-control tier (cont_hd). Free/open-source
# since 2021, no license key needed. The Tier 1/continuous tiers do NOT require it.
# mujoco<4: MuJoCo 4.0.0 (2026-11-06) changes the physics these families were calibrated
# and admitted under. Freshly recalibrated under 4.0.0, mujoco_joint_limit_gaming stops
# admitting at 0.9 (L0 AUROC 0.333 [0.226, 0.440]), and the same command under 3.17.0
# admits it. Moving to 4.x means re-measuring the MuJoCo families and the ledger, not
# bumping this bound.
mujoco = ["gymnasium[mujoco]>=1.0,<2", "mujoco>=3,<4"]
# PettingZoo/mpe2-based multi-agent tier (MULTI_AGENT). MPE was split out of
# PettingZoo core as of PettingZoo 1.26 -- mpe2 is the current Farama-maintained
# package; pettingzoo[mpe] is NOT a valid extra. The Tier 1/continuous/mujoco tiers
# do NOT require it.
# mpe2<1.2: mpe2 1.2.0 (after 2026-11-23) replaces simple_spread_v3 and simple_tag_v3
# with simple_spread_v4 and simple_tag_v4, and three families import the v3 names
# (pettingzoo_tacit_collusion_gaming, pettingzoo_free_rider_exploitation,
# pettingzoo_fixed_opponent_exploitation). A new environment version is a new
# environment: those families were calibrated, and the admission ledger was certified,
# under mpe2 1.1.1 (requirements/ci-admission-linux-py312.txt). Moving to 1.2 means
# porting them to the v4 environments and re-measuring, not bumping this bound.
pettingzoo = ["pettingzoo>=1.24,<2", "mpe2>=1.0,<1.2"]
# Interactive leaderboard viewer (space/app.py). Not needed to use the benchmark itself.
space = ["gradio>=4.0,<7", "huggingface_hub>=0.20,<2", "pandas>=2.0,<4"]
dev = [
    "pytest>=7.0,<10",
    "pytest-cov>=4.0,<8",
    # The `slow` admission tier is ~67 min serial in CI and every case is an
    # independently-seeded family/difficulty cell that shares no state, so it
    # parallelises almost perfectly. Four workers take it to ~17 min; beyond that the
    # single slowest cell is the floor. Pinned because -p xdist changes collection.
    "pytest-xdist>=3.0,<4",
    "hypothesis>=6.0,<7",
    # ruff is pre-1.0: breaking changes ship in minor releases, so cap the minor.
    "ruff>=0.1.0,<0.16",
    "mypy>=1.0,<3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
pythonpath = ["src"]
# `-m "not slow"` is a split, not a skip: the deselected tests run in the
# `admission-slow` job in .github/workflows/tests.yml, and pytest prints the
# deselected count on every run so the split is visible rather than silent.
# Without it the default suite cannot finish -- one `mujoco_joint_limit_gaming`
# admission-smoke tier alone costs ~230s of proxy calibration before its first
# rollout. Run everything locally with `pytest tests/ -m ""`.
addopts = "-q --tb=short -m 'not slow'"
markers = [
    "slow: costs minutes or more (MuJoCo/PettingZoo/RLHF-RM/sequence rollouts and their per-difficulty proxy calibrations). Deselected by default; run with `-m slow` or `-m ''`.",
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.black]
line-length = 100
target-version = ["py310"]
