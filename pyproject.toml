[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rhob"
version = "1.8.0"
description = "Reward-Hacking Onset Benchmark (RHOB) - standardized evaluation for reward-hacking detection"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Aarav Shah", email = "aarav7.shah@gmail.com"}]

# Version policy: floors state the oldest supported release; upper bounds cap the
# next major so a dependency's breaking release cannot silently change benchmark
# numbers. These ranges make RHOB installable; they do NOT reproduce a result.
# The exact verified stack is in `requirements-lock.txt` -- use that to reproduce.
dependencies = [
    "numpy>=1.24,<3",
    "scipy>=1.10,<2",
    "scikit-learn>=1.3,<2",
    "h5py>=3.8,<4",
    "pydantic>=2.0,<3",
    "click>=8.0,<9",
]

[project.optional-dependencies]
# Needed only for PPO/SB3-based trajectory generation in future
# continuous-control tiers. The Tier 1 tabular environments do not require them.
environments = ["gymnasium>=0.29,<2", "stable-baselines3>=2.0,<3"]
# Continuous-control tier (Pairs 02-04): the DQN camping agent needs PyTorch.
# The Tier 1 gridworld pairs and all core evaluation do NOT require it.
continuous = ["torch>=2.0,<3", "matplotlib>=3.5,<4"]
# MuJoCo-based high-dimensional continuous-control tier (cont_hd). Free/open-source
# since 2021, no license key needed. The Tier 1/continuous tiers do NOT require it.
mujoco = ["gymnasium[mujoco]>=1.0,<2"]
# PettingZoo/mpe2-based multi-agent tier (MULTI_AGENT). MPE was split out of
# PettingZoo core as of PettingZoo 1.26 -- mpe2 is the current Farama-maintained
# package; pettingzoo[mpe] is NOT a valid extra. The Tier 1/continuous/mujoco tiers
# do NOT require it.
pettingzoo = ["pettingzoo>=1.24,<2", "mpe2>=1.0,<2"]
# Interactive leaderboard viewer (space/app.py). Not needed to use the benchmark itself.
space = ["gradio>=4.0,<7", "huggingface_hub>=0.20,<2", "pandas>=2.0,<4"]
dev = [
    "pytest>=7.0,<10",
    "pytest-cov>=4.0,<8",
    "hypothesis>=6.0,<7",
    # ruff is pre-1.0: breaking changes ship in minor releases, so cap the minor.
    "ruff>=0.1.0,<0.16",
    "mypy>=1.0,<3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
pythonpath = ["src"]
addopts = "-q --tb=short"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.black]
line-length = 100
target-version = ["py310"]
