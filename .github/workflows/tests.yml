name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # 04:17 UTC daily -- for the `admission-slow` job only (see its `if:`).
    - cron: "17 4 * * *"
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev,continuous,mujoco,pettingzoo]"
      # Deselects `-m slow` (see [tool.pytest.ini_options] in pyproject.toml). Those
      # tests are not skipped -- they run in the `admission-slow` job below.
      - name: Test
        run: pytest tests/ -q
      - name: Lint
        run: ruff check src tests scripts

  admission-slow:
    # The reduced-power admission smoke screens for the MuJoCo, PettingZoo, RLHF-RM and
    # sequence families, which the per-push job deselects. They are slow for a structural
    # reason, not an incidental one: each family calibrates its proxy once per difficulty
    # (~78s for mujoco_camping, ~230s for mujoco_joint_limit_gaming) before any rollout
    # happens, and the screen covers every difficulty the benchmark scores. Nightly plus
    # on-demand rather than per-push, because a >30-minute job on every PR gets ignored,
    # and an ignored check is the same as no check.
    #
    # This is the *screen*, not certification: the +/-0.10 matched-proxy claim comes from
    # `python scripts/admission_ledger.py`, which is run by hand and committed to
    # `admission/`.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev,continuous,mujoco,pettingzoo]"
      - name: Slow admission smoke screens
        run: pytest tests/ -q -m slow

  no-torch-import-check:
    # Core dependencies (numpy, scipy, scikit-learn, pydantic, click) must be
    # enough to import the package and use every tabular/gridworld family and
    # every detector except the two torch-based ones (README's stated
    # contract). This job installs only [dev] -- no torch -- and would have
    # caught the regression where an eager `import torch` deep in the
    # continuous-tier family chain made the entire rhob.v3 package
    # unimportable without PyTorch.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (no torch)
        run: pip install -e ".[dev]"
      - name: Import without torch
        run: |
          python -c "
          import rhob
          import rhob.v3
          import rhob.v3.families
          from rhob.v3.registry import FamilyRegistry
          from rhob.v3.benchmark import Benchmark
          fams = FamilyRegistry.list_families()
          assert 'gridworld_camping' in fams, fams
          print('OK:', fams)
          "
