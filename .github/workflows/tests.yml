name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # 04:17 UTC daily (GitHub often starts it hours late). Every job runs; `admission-slow`
    # runs only on this and on workflow_dispatch (see its `if:`), and the unpinned `pytest`
    # matrix running here too is what meets each new release within a day of it shipping.
    - cron: "17 4 * * *"
  workflow_dispatch:

# Read-only. The one job that writes anything, `report`, asks for `issues: write` itself.
permissions:
  contents: read

# Keyed on event and ref. A newer push to a pull request supersedes the run in flight,
# which is all a pull request run is for. Every other run (a push to main, the nightly, a
# manual run) gets a group of its own, by run id, and is never cancelled: each is the
# record for its commit, and admission-slow is hours of calibration a cancel would throw
# away. A shared group would not be enough even with cancel-in-progress false, because
# GitHub still cancels a run that is *waiting* in a group when a newer one arrives, so the
# middle one of three quick merges would be left with a cancelled run.
concurrency:
  group: tests-${{ github.event_name }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pytest:
    runs-on: ubuntu-latest
    # The whole pull request run took about 7 minutes on 2026-11-27 (45950301742).
    timeout-minutes: 45
    strategy:
      # Every leg reports. With the default fail-fast, the first leg to fail cancels the
      # others, so a red run cannot say whether the break is specific to one Python.
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev,continuous,mujoco,pettingzoo]"
      # Deselects `-m slow` (see [tool.pytest.ini_options] in pyproject.toml). Those
      # tests are not skipped -- they run in the `admission-slow` job below.
      #
      # -n auto because the smoke screens became one case per (family, difficulty). Six
      # families are marked xfail(strict) and used to stop at their first failing tier;
      # now every tier runs, which is the point -- it is how the two tiers of
      # reward_channel_tampering that actually pass became visible -- but it took this
      # job from 215s to 587s measured locally. Distributing gives 235s with, verified,
      # an identical outcome for all 650 tests. `auto` rather than a fixed count: the
      # runner's core count is GitHub's to change, not ours to hardcode.
      - name: Test
        run: pytest tests/ -q -n auto
      - name: Lint
        run: ruff check src tests scripts

  admission-slow:
    # The reduced-power admission smoke screens for the MuJoCo, PettingZoo, RLHF-RM and
    # sequence families, which the per-push job deselects. They are slow for a structural
    # reason, not an incidental one: each family calibrates its proxy once per difficulty
    # (~74s for mujoco_camping) and then rolls out 12 layouts x 4 seeds x 2 variants for
    # every difficulty the benchmark scores. Measured on mujoco_camping at one tier:
    # 74s calibration, 229s rollouts -- so rollouts dominate, and they are what
    # parallelises. Nightly plus on-demand rather than per-push, because a >30-minute
    # job on every PR gets ignored, and an ignored check is the same as no check.
    #
    # Distributed. Every case is one (family, difficulty) cell with explicit seeds and no
    # shared state, so spreading them changes only wall clock. The calibration cache
    # below is what stops each worker re-deriving the same amplitudes, which would
    # otherwise eat most of the win.
    #
    # Do not read the speedup as a shorter job. Measured on a 20-core box: the previous
    # serial run took 132 min, and the first distributed run took 132 min -- for roughly
    # THREE TIMES the work, because the twelve failing families used to stop at their
    # first tier and now run all three (13 failures became 37). The parallelism is real;
    # it was spent on coverage rather than on finishing sooner, which is the trade the
    # per-tier split was made for. Neither figure is a controlled measurement: the
    # workload changed between them and the box was busy. Treat them as order-of-
    # magnitude, and expect this job to stay long.
    #
    # This is the *screen*, not certification: the +/-0.10 matched-proxy claim comes from
    # `python scripts/admission_ledger.py`, which is run by hand and committed to
    # `admission/`.
    #
    # 240 minutes. A cold run on a slow runner, the first on the CI lock (43836925199,
    # 2026-11-16), took 153 and passed. Main's first nightly after PR #2 merges will be
    # cold too: a workflow on main cannot restore a cache saved on this branch, and main's
    # own tarball holds entries under the old key, which all miss. Later merges restore
    # main's previous tarball and recompute only what they invalidate, but a lock bump or an
    # edit to calibration_cache.py is cold again, so 180 left too little margin.
    #
    # ubuntu-24.04, not ubuntu-latest, as in drift.yml and regenerate.yml. The lock fixes
    # the wheels; the image still supplies glibc's libm, which the simulators call, and the
    # calibration cache's per-entry keys do not see the image. ubuntu-latest became 26.04
    # without a commit here. The tarball key below names the image, so a move between
    # images starts a new tarball instead of restoring calibrations derived on another one.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # From a hashed lock, not from pyproject.toml's ranges. This job is the physics
      # screen, and its verdicts move with the simulator: installing unpinned, it met MuJoCo
      # 4.0.0 the night that was published and went red on an unchanged commit
      # (2026-11-07, docs/postmortems/2026-11-mujoco-calibration-cache.md). On the lock,
      # the same commit gets the same distributions every night. A new release reaches
      # this job only when someone regenerates requirements/ci-admission-linux-py312.txt
      # with scripts/update_ci_lock.sh, which is a diff a person reviews. What still
      # floats is the CPython 3.12 patch release, pip and the weekly updates of the
      # ubuntu-24.04 image. New releases are tried weekly by .github/workflows/drift.yml,
      # before anyone adopts them.
      #
      # Two pip commands, because hash-checking mode cannot install an editable checkout
      # (there is no single file to hash). rhob goes in second with --no-deps, so nothing
      # outside the lock is installed. The one unpinned piece is the build backend
      # (setuptools>=77, pyproject.toml's [build-system]), which pip fetches into an
      # isolated build environment to build rhob's own editable wheel and then discards.
      # `pip check` confirms the installed set is consistent. It reads only base requirements, not extras, so
      # scripts/check_ci_lock.py --installed then checks every requirement pyproject.toml
      # declares for these four extras, and the extras those ask for in turn
      # (gymnasium[mujoco]). Without it, a bound tightened in pyproject.toml and not carried
      # into the lock would be ignored here without a word. The same script's static check
      # runs in the fast suite (tests/test_ci_lock.py), so such a change fails its own pull
      # request first.
      #
      # The tarball key that .github/actions/calibration-cache computes reads the installed
      # versions, and on the lock those are the same every night, so its physics token is
      # too. A regenerated lock that moves one of those versions starts a new tarball, and
      # that night recalibrates from cold. So does a change of the numerics variables the
      # token and the key fold in (this job sets none), or of the runner image, which the
      # key names.
      #
      # The `pytest` matrix above stays unpinned, on purpose. It runs on every push and
      # nightly, takes minutes, covers 3.10 and 3.11, which the lock does not, as well as
      # 3.12, and is how a new release that breaks the fast suite shows up within a day of
      # shipping rather than at the next lock bump.
      - name: Install
        run: |
          pip install --require-hashes -r requirements/ci-admission-linux-py312.txt
          pip install --no-deps -e .
          pip check
          python scripts/check_ci_lock.py --installed
      # Validity is decided per entry, in src/rhob/v3/calibration_cache.py: each key
      # hashes the family module, every rhob module it imports, and the installed
      # versions of the numerical stack. This tarball key only chooses what to restore.
      # It used to be the family sources alone, on the belief that the calibrations were
      # pure functions of them -- and since this job then installed unpinned, MuJoCo 4.0.0
      # (2026-11-06) was served calibrations derived under 3.17, and the nightly went red
      # on an unchanged commit. A key that cannot see a change cannot fail on it.
      #
      # Now: one key definition, .github/actions/calibration-cache, shared with every
      # scoring job of regenerate.yml. It names what the per-entry keys hash (the physics
      # token, which since 2026-11-27 includes the numerics variables) plus two things they
      # do not, the runner image and, readably, the numerics pins, then src/rhob's hash and
      # this run's id and attempt, and restores the newest tarball at the same sources, then
      # at any. A fallback is safe only because the per-entry keys are complete: entries an
      # edit or upgrade made stale simply miss, and are recomputed and re-saved. The action's
      # header has the rest, including why every save key carries the run id and attempt.
      #
      # This job sets no numerics pins (regenerate.yml does), so its tarballs and
      # regenerate.yml's never restore each other: the pins move a calibration's last bits,
      # and the slow screen is held to the environment its strict xfails were set in.
      #
      # Split restore/save, deliberately, rather than the combined `actions/cache`.
      # The combined form saves in a post-job step that is SKIPPED when the job fails,
      # and that turned one red suite into a permanently cold cache: the tests fail, the
      # cache is never written, the next nightly recalibrates all 33 families from
      # scratch, the warm budget blows, and the job stays slow and red for a reason
      # unrelated to what is actually failing. Measured on 2026-09-19 after 13
      # consecutive red nightlies: the repository had ZERO caches
      # (`/actions/caches` reported total_count 0) and every run logged
      # "Cache not found for input keys: calib-Linux-py3.12-...". The calibrations are
      # correct work whether or not the assertions downstream pass, so they are saved
      # either way.
      - name: Restore the calibration cache
        id: calib
        uses: ./.github/actions/calibration-cache
      # Serial, and NOT cheap on a cold cache -- generate_pair derives the calibration and
      # returns closures without rolling anything out, so this costs the calibrations
      # exactly, and some are minutes each: sequence_length_padding._legit_empty_rate is
      # 300s, mujoco_joint_limit_gaming is 38 MINUTES. It is here because that work has to
      # happen regardless, and doing it once serially beats several workers racing for the
      # same entry -- a family's tiers are separate test cases now, so without this the
      # same 38 minutes could be paid up to three times. On a restored cache: seconds.
      #
      # Budgeted at 45 min, and non-fatal. Warming is an optimisation, and an optimisation
      # must never be the reason a job reports nothing: measured cold, the full sweep can
      # approach this job's whole timeout, which would kill it in a step that
      # produces no test results at all -- strictly worse than having no warm step. Past
      # the budget the script names what it left cold and the tests derive those
      # themselves, less efficiently but correctly.
      #
      # The step timeout is the budget PLUS the worst known single-family cost, not the
      # budget alone. The script checks its budget between families and a calibration is
      # not interruptible, so a family that starts just inside the budget runs to
      # completion past it. At 50 minutes against a 45-minute budget this step was killed
      # mid-calibration on every cold run, which also discarded its progress output.
      # 45 + 38 (mujoco_joint_limit_gaming) = 83, rounded up.
      - name: Warm the calibration cache
        timeout-minutes: 90
        continue-on-error: true
        run: python scripts/warm_calibration_cache.py --budget-seconds 2700
      - name: Slow admission smoke screens
        # The calibrations are already on disk by now, so the default per-test
        # distribution can spread a family's tiers freely. Pinning tiers to one worker
        # (--dist loadfile) would make the critical path three times the slowest cell for
        # no benefit once the cache is shared.
        run: pytest tests/ -q -m slow -n auto --durations=15
      # After the tests, so calibrations the tests derived for themselves (anything the
      # warm step left cold) are captured too, and `if: always()` so a failing assertion
      # never costs the next run its cache. Always saved, under this attempt's own key: an
      # exact restore can no longer happen, a re-run of this job saves under a key of its
      # own, and a run that restored everything and derived nothing costs one more tarball
      # of about 21 KB.
      - name: Save calibration cache
        if: ${{ always() && steps.calib.outputs.key != '' }}
        uses: actions/cache/save@v6
        with:
          path: .rhob_cache
          key: ${{ steps.calib.outputs.key }}

  no-torch-import-check:
    # Core dependencies (numpy, scipy, scikit-learn, pydantic, click) must be
    # enough to import the package and use every tabular/gridworld family and
    # every detector except the two torch-based ones (README's stated
    # contract). This job installs only [dev] -- no torch -- and would have
    # caught the regression where an eager `import torch` deep in the
    # continuous-tier family chain made the entire rhob.v3 package
    # unimportable without PyTorch.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install (no torch)
        run: pip install -e ".[dev]"
      - name: Import without torch
        run: |
          python -c "
          import rhob
          import rhob.v3
          import rhob.v3.families
          from rhob.v3.registry import FamilyRegistry
          from rhob.v3.benchmark import Benchmark
          fams = FamilyRegistry.list_families()
          assert 'gridworld_camping' in fams, fams
          print('OK:', fams)
          "

  report:
    # The nightly is the run nobody is watching, and the one that meets each new release
    # (the unpinned `pytest` matrix) and the physics screen (`admission-slow`). Its red mark
    # used to sit on the Actions page until someone happened to look. As in drift.yml: one
    # tracking issue, found by its exact title, opened or commented on when a scheduled run
    # does not pass, and closed when one passes again. Scheduled runs only, so pull
    # requests and manual runs never touch it. Its own job, so `issues: write` is the only
    # permission it holds and it never shares a runner with the code the tests installed.
    needs: [pytest, admission-slow, no-torch-import-check]
    if: ${{ always() && github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open, update or close the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TITLE: Nightly tests are failing
          PYTEST: ${{ needs.pytest.result }}
          SLOW: ${{ needs.admission-slow.result }}
          NO_TORCH: ${{ needs.no-torch-import-check.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          number="$(gh issue list --state open --search "\"$TITLE\" in:title" \
            --json number,title --jq '.[] | select(.title == env.TITLE) | .number' | head -n 1)"
          if [ "$PYTEST" = "success" ] && [ "$SLOW" = "success" ] && [ "$NO_TORCH" = "success" ]; then
            if [ -n "$number" ]; then
              gh issue close "$number" --comment "Passing again: $RUN_URL"
            fi
            exit 0
          fi
          body="$(cat <<EOF
          The nightly run of tests.yml on $GITHUB_REF_NAME did not pass: $RUN_URL

          - pytest (Python 3.10, 3.11, 3.12; unpinned, the newest releases pyproject.toml allows): $PYTEST
          - admission-slow (the slow smoke screens, on the hashed CI lock): $SLOW
          - no-torch-import-check: $NO_TORCH

          A red pytest leg with a green admission-slow usually means a new release broke the fast suite; the lock is unaffected until it is regenerated (requirements/README.md). A red admission-slow on the lock is a change in this repository or in the runner image.
          EOF
          )"
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$TITLE" --body "$body"
          fi
