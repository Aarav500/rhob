name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # 04:17 UTC daily -- for the `admission-slow` job only (see its `if:`).
    - cron: "17 4 * * *"
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev,continuous,mujoco,pettingzoo]"
      # Deselects `-m slow` (see [tool.pytest.ini_options] in pyproject.toml). Those
      # tests are not skipped -- they run in the `admission-slow` job below.
      #
      # -n auto because the smoke screens became one case per (family, difficulty). Six
      # families are marked xfail(strict) and used to stop at their first failing tier;
      # now every tier runs, which is the point -- it is how the two tiers of
      # reward_channel_tampering that actually pass became visible -- but it took this
      # job from 215s to 587s measured locally. Distributing gives 235s with, verified,
      # an identical outcome for all 650 tests. `auto` rather than a fixed count: the
      # runner's core count is GitHub's to change, not ours to hardcode.
      - name: Test
        run: pytest tests/ -q -n auto
      - name: Lint
        run: ruff check src tests scripts

  admission-slow:
    # The reduced-power admission smoke screens for the MuJoCo, PettingZoo, RLHF-RM and
    # sequence families, which the per-push job deselects. They are slow for a structural
    # reason, not an incidental one: each family calibrates its proxy once per difficulty
    # (~74s for mujoco_camping) and then rolls out 12 layouts x 4 seeds x 2 variants for
    # every difficulty the benchmark scores. Measured on mujoco_camping at one tier:
    # 74s calibration, 229s rollouts -- so rollouts dominate, and they are what
    # parallelises. Nightly plus on-demand rather than per-push, because a >30-minute
    # job on every PR gets ignored, and an ignored check is the same as no check.
    #
    # Distributed. Every case is one (family, difficulty) cell with explicit seeds and no
    # shared state, so spreading them changes nothing but wall clock: ~67 min serial,
    # against a floor set by the slowest single cell. Extra workers past that buy
    # nothing. The calibration cache below is what stops each worker re-deriving the
    # same amplitudes, which would otherwise eat most of the win.
    #
    # This is the *screen*, not certification: the +/-0.10 matched-proxy claim comes from
    # `python scripts/admission_ledger.py`, which is run by hand and committed to
    # `admission/`.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev,continuous,mujoco,pettingzoo]"
      # The calibrations are pure functions of the family modules' source, and
      # src/rhob/v3/calibration_cache.py keys entries on a hash of exactly that. Keying
      # the restore on the same source means a stale entry is unreachable rather than
      # merely unlikely: edit a family, get a new cache key, recompute. A miss costs a
      # recomputation, never a wrong number.
      - name: Restore calibration cache
        uses: actions/cache@v4
        with:
          path: .rhob_cache
          key: calib-${{ runner.os }}-py3.12-${{ hashFiles('src/rhob/v3/families/*.py', 'src/rhob/v3/calibration_cache.py') }}
      # Serial, and NOT cheap on a cold cache -- generate_pair derives the calibration and
      # returns closures without rolling anything out, so this costs the calibrations
      # exactly, and some are minutes each: sequence_length_padding._legit_empty_rate is
      # 300s, mujoco_joint_limit_gaming is 38 MINUTES. It is here because that work has to
      # happen regardless, and doing it once serially beats several workers racing for the
      # same entry -- a family's tiers are separate test cases now, so without this the
      # same 38 minutes could be paid up to three times. On a restored cache: seconds.
      #
      # Budgeted at 45 min, and non-fatal. Warming is an optimisation, and an optimisation
      # must never be the reason a job reports nothing: measured cold, the full sweep can
      # approach this job's whole 180-minute timeout, which would kill it in a step that
      # produces no test results at all -- strictly worse than having no warm step. Past
      # the budget the script names what it left cold and the tests derive those
      # themselves, less efficiently but correctly.
      - name: Warm the calibration cache
        timeout-minutes: 50
        continue-on-error: true
        run: python scripts/warm_calibration_cache.py --budget-seconds 2700
      - name: Slow admission smoke screens
        # The calibrations are already on disk by now, so the default per-test
        # distribution can spread a family's tiers freely. Pinning tiers to one worker
        # (--dist loadfile) would make the critical path three times the slowest cell for
        # no benefit once the cache is shared.
        run: pytest tests/ -q -m slow -n auto --durations=15

  no-torch-import-check:
    # Core dependencies (numpy, scipy, scikit-learn, pydantic, click) must be
    # enough to import the package and use every tabular/gridworld family and
    # every detector except the two torch-based ones (README's stated
    # contract). This job installs only [dev] -- no torch -- and would have
    # caught the regression where an eager `import torch` deep in the
    # continuous-tier family chain made the entire rhob.v3 package
    # unimportable without PyTorch.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (no torch)
        run: pip install -e ".[dev]"
      - name: Import without torch
        run: |
          python -c "
          import rhob
          import rhob.v3
          import rhob.v3.families
          from rhob.v3.registry import FamilyRegistry
          from rhob.v3.benchmark import Benchmark
          fams = FamilyRegistry.list_families()
          assert 'gridworld_camping' in fams, fams
          print('OK:', fams)
          "
