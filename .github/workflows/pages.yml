name: deploy-site

on:
  push:
    branches: [main]
    paths: ["docs/site/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

# Two jobs, not one. With upload-pages-artifact v5 (upload-artifact v7 inside) and
# deploy-pages v5 in one job, deploy-pages listed the run's artifacts a second after the
# upload and found none ("No artifacts named github-pages were found"): on the push that
# merged #3 (2026-11-25) and again on a fresh dispatch. A re-run of that job did list the
# first attempt's artifact (it then refused, finding two), so an artifact from a finished
# job is visible; the upload gets its own job, as in GitHub's Jekyll starter workflow. If
# this still fails, the pairing GitHub's starters ship is upload-pages-artifact@v3 with
# deploy-pages@v5 (upload-artifact v4 inside, which still targets Node 20). Re-running a
# failed deploy in the same run never helps: it finds two artifacts and refuses.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
